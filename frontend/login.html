<!DOCTYPE html>
<html lang="fa" dir="rtl" class="login-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="ورود به lalaBye">
  <meta name="theme-color" content="#87CEEB">
  <title>ورود | lalaBye</title>
  <link rel="icon" href="images/logo-loginpage.png" type="image/png">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login-scene.css">
</head>
<body class="login-page">
  <div class="login-bg" id="login-bg" aria-hidden="true">
    <img class="login-bg__img" id="login-bg-img" src="images/login-background.jpg" alt="" decoding="async" fetchpriority="high">
    <div class="login-scene">
      <div class="login-scene__sky"></div>
      <div class="login-scene__sky-night"></div>
      <div class="login-scene__sun"></div>
      <div class="login-scene__moon"></div>
      <div class="login-scene__stars"></div>
      <div class="login-scene__cloud login-scene__cloud--1"></div>
      <div class="login-scene__cloud login-scene__cloud--2"></div>
      <div class="login-scene__hills"></div>
      <div class="login-scene__room">
        <span class="login-scene__lamp login-scene__lamp--left" aria-hidden="true"></span>
        <span class="login-scene__lamp login-scene__lamp--right" aria-hidden="true"></span>
        <div class="login-scene__window" aria-hidden="true"></div>
      </div>
      <div class="login-scene__dim"></div>
    </div>
  </div>

  <p class="login-night-hint" id="login-night-hint">وقت خواب نزدیک است…</p>

  <main class="login-shell">
    <header class="login-brand">
      <div class="login-logo-ring" aria-hidden="true">
        <img class="login-logo" src="images/logo-loginpage.png" alt="lalaBye">
      </div>
      <h1 class="login-app-name brand-name"><span class="brand-name__lala">lala</span><span class="brand-name__bye">Bye</span></h1>
      <p class="login-tagline">مناسب برای گروه سنی الف - ب ( ۰ تا ۸ سال)</p>
    </header>

    <div class="login-card">
      <div class="auth-error" id="login-error" hidden role="alert"></div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group form-group--login" id="phone-group">
          <label for="login-phone">شماره موبایل</label>
          <input
            type="tel"
            id="login-phone"
            name="phone"
            placeholder="۰۹۱۲۳۴۵۶۷۸۹"
            inputmode="numeric"
            autocomplete="tel"
            maxlength="13"
            required
          >
        </div>

        <div class="form-group form-group--login" id="otp-group" hidden>
          <label for="login-otp">کد تأیید</label>
          <input
            type="text"
            id="login-otp"
            name="otp"
            placeholder="۶ رقم"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="6"
            pattern="[0-9]*"
          >
          <p class="login-otp-hint" id="otp-hint" hidden></p>
        </div>

        <div class="login-actions">
          <button type="button" class="btn btn--primary btn--full btn--login" id="btn-send-otp">
            ارسال کد
          </button>
          <button type="submit" class="btn btn--primary btn--full btn--login" id="btn-verify-otp" hidden>
            ورود به <span class="brand-name"><span class="brand-name__lala">lala</span><span class="brand-name__bye">Bye</span></span>
          </button>
          <button type="button" class="btn btn--ghost btn--full btn--login-secondary" id="btn-change-phone" hidden>
            تغییر شماره موبایل
          </button>
        </div>
      </form>

      <div class="auth-divider" role="separator">
        <span>یا</span>
      </div>

      <button type="button" class="btn btn--google btn--full" id="btn-google-signin">
          <svg class="btn-google__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
        <span>ورود با گوگل</span>
      </button>

      <p class="login-footnote">مناسب برای لحظات قبل خواب</p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/login-scene.js"></script>
  <script src="js/device.js"></script>
  <script src="js/auth.js"></script>
  <script>window.StorytellingAuth.redirectIfLoggedIn();</script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
